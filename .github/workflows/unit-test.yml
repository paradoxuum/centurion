name: unit-test

on: [push, pull_request, workflow_dispatch]

jobs:
    run:
        name: Run Luau Tests
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
            - name: Checkout Project
              uses: actions/checkout@v5

            - name: Install Rokit
              uses: CompeyDev/setup-rokit@v0.1.2

            # tests.luau errors when any test fails, so luau exits non-zero
            - name: Run Unit Tests
              run: luau test/unit/tests.luau
