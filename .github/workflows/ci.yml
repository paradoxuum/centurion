name: CI

on:
    push:
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Install Rokit
              uses: CompeyDev/setup-rokit@v0.1.2

            - name: Run Stylua
              run: stylua --check .

            - name: Run Selene
              run: selene .
